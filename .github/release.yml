changelog:
  exclude:
    labels:
      - ignore-for-release
      - internal-only
  categories:
    - title: Protocol and type system
      labels:
        - protocol
        - types
        - feature
        - enhancement
    - title: Creator workflows and starter packs
      labels:
        - starter-pack
        - workflow
        - integration
    - title: Trust, attestation, and governance
      labels:
        - attestation
        - security
        - governance
        - trust
    - title: Documentation
      labels:
        - documentation
        - design
    - title: Maintenance
      labels:
        - dependencies
        - chore
        - ci
    - title: Other changes
      labels:
        - '*'
