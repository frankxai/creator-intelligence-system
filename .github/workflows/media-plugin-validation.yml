name: Validate media plugin source
on:
  pull_request:
    paths:
      - "plugins/starlight-media-excellence/**"
      - "docs/MEDIA_EXCELLENCE_PLAYBOOK.md"
      - "AGENTS.md"
      - "scripts/validate_media_plugin.py"
      - "tests/test_media_plugin_contract.py"
      - "scripts/render_media_pack.py"
      - "scripts/verify_media_manifest.py"
      - "examples/media-excellence/**"
      - "tests/test_media_pack.py"
      - ".github/workflows/media-plugin-validation.yml"
  workflow_dispatch:
jobs:
  structural-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference renderer dependencies
        run: python -m pip install cairosvg pymupdf pillow
      - name: Validate package
        run: python scripts/validate_media_plugin.py
      - name: Negative tests
        run: python -m unittest discover -s tests -p 'test_media_plugin_contract.py' -v
      - name: Renderer/receipt behavior tests
        run: python -m unittest discover -s tests -p 'test_media_pack.py' -v
      - name: Render independent reference pack
        run: |
          python scripts/render_media_pack.py --output /tmp/starlight-media-ci --skip-video
          python scripts/verify_media_manifest.py /tmp/starlight-media-ci/manifest.json
