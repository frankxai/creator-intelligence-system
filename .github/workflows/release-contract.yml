name: Release contract

on:
  pull_request:
    paths:
      - '.github/release.yml'
      - '.github/workflows/draft-github-prerelease.yml'
      - '.github/workflows/release-contract.yml'
      - 'ATTESTATION.md'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'README.md'
      - 'docs/releases/**'
      - 'package.json'
      - 'packages/**/package.json'
      - 'scripts/validate_release.py'
  push:
    branches: [main]
    paths:
      - '.github/release.yml'
      - '.github/workflows/draft-github-prerelease.yml'
      - '.github/workflows/release-contract.yml'
      - 'ATTESTATION.md'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'README.md'
      - 'docs/releases/**'
      - 'package.json'
      - 'packages/**/package.json'
      - 'scripts/validate_release.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Verify release truth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python3 scripts/validate_release.py
