<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Creator Intelligence System</title>
  <desc id="desc">A six-layer creator content substrate from capture through learning, built on identity, memory, MCP, and governance.</desc>
  <rect width="1200" height="420" rx="0" fill="#08111F"/>
  <rect x="1" y="1" width="1198" height="418" rx="0" stroke="#25445F" stroke-width="2"/>
  <path d="M0 316 C160 276 264 354 426 314 C590 273 687 205 853 238 C1011 269 1084 205 1200 162 V420 H0 V316Z" fill="#0D2533"/>
  <path d="M0 355 C182 330 322 382 492 350 C657 319 784 254 946 292 C1056 318 1134 285 1200 260 V420 H0 V355Z" fill="#0F3A35" opacity="0.78"/>

  <g opacity="0.42">
