  <text x="99" y="139" fill="#B8D4D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Sovereign content substrate for AI-first creators</text>
  <text x="99" y="170" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">CIP v0.1 / CAPTURE -> STRATEGY -> PRODUCE -> DISTRIBUTE -> LEARN</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="94" y="224" width="138" height="68" rx="10" fill="#11283A" stroke="#38BDF8"/>
    <text x="118" y="250" fill="#E0F2FE" font-size="14" font-weight="800">L2 CAPTURE</text>
    <text x="118" y="273" fill="#A9C6D3" font-size="12">Voice, files, clips</text>

    <rect x="252" y="224" width="138" height="68" rx="10" fill="#11283A" stroke="#6EE7B7"/>
    <text x="276" y="250" fill="#E9F8F3" font-size="14" font-weight="800">L3 STRATEGY</text>
    <text x="276" y="273" fill="#A9C6D3" font-size="12">Calendar, ICP, format</text>

    <rect x="410" y="224" width="138" height="68" rx="10" fill="#11283A" stroke="#C084FC"/>
    <text x="436" y="250" fill="#F3E8FF" font-size="14" font-weight="800">L4 PRODUCE</text>
    <text x="436" y="273" fill="#A9C6D3" font-size="12">Models, media, drafts</text>

    <rect x="568" y="224" width="154" height="68" rx="10" fill="#11283A" stroke="#F59E0B"/>
    <text x="596" y="250" fill="#FEF3C7" font-size="14" font-weight="800">L5 DISTRIBUTE</text>
    <text x="596" y="273" fill="#A9C6D3" font-size="12">Channels, RSS, social</text>

    <rect x="742" y="224" width="138" height="68" rx="10" fill="#11283A" stroke="#34D399"/>
    <text x="770" y="250" fill="#DCFCE7" font-size="14" font-weight="800">L6 LEARN</text>
    <text x="770" y="273" fill="#A9C6D3" font-size="12">Memory, loops, perf</text>

    <rect x="900" y="224" width="174" height="68" rx="10" fill="#102A2F" stroke="#2DD4BF"/>
    <text x="930" y="250" fill="#CCFBF1" font-size="14" font-weight="800">L1 SUBSTRATE</text>
    <text x="930" y="273" fill="#A9C6D3" font-size="12">Identity, memory, MCP</text>
